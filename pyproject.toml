[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nexarm-teleop"
version = "0.1.0"
description = "Latency measurement and feedforward compensation for NexArm leader-follower teleoperation"
requires-python = ">=3.12"
dependencies = ["numpy", "pyserial"]

[tool.setuptools]
packages = ["nexarm_teleop"]
